  }
  a.card:hover, a.card:active {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(0,0,0,.38);
  }

  .card .name { font-size: 21px; letter-spacing: 3px; }
  .card .sub {
    margin-top: 8px;
    font-size: 11px;
    letter-spacing: 3px;
    color: #a4161a;
    text-transform: uppercase;
  }

  footer {
    margin-top: 56px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #b98f4e;
  }

  @media (max-width: 560px) {
    .xi { font-size: 64px; }
    h1 { font-size: 22px; letter-spacing: 4px; }
