<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "Kaiti SC", "STKaiti", "KaiTi", "Noto Serif SC", "Songti SC", serif;

    color: #f3e2c0;

    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
  }

  .xi {
    font-size: 84px;

    margin-bottom: 18px;

  .cards {

  a.card {

    text-align: center;
    color: #6d1212;
    transition: transform .18s ease, box-shadow .18s ease;
    box-shadow: 0 3px 14px rgba(0,0,0,.28);
  }
  a.card:hover, a.card:active {
    transform: translateY(-3px);
    box-shadow: 0 8px 22px rgba(0,0,0,.38);
  }

  .card .name { font-size: 21px; letter-spacing: 3px; }
  .card .sub {
    margin-top: 8px;

    letter-spacing: 3px;
    color: #a4161a;
    text-transform: uppercase;
  }

  footer {
    margin-top: 56px;
    font-size: 12px;
    letter-spacing: 2px;
    color: #b98f4e;
  }

  @media (max-width: 560px) {
    .xi { font-size: 64px; }
    h1 { font-size: 22px; letter-spacing: 4px; }
    .cards.three, .cards.two { grid-template-columns: 1fr; }
  }

<style>
  #editBtn{margin:26px auto 0;display:block;background:none;border:1px solid rgba(232,198,106,.45);color:#d9b36a;
    font-family:inherit;font-size:13px;letter-spacing:4px;padding:9px 26px;border-radius:999px;cursor:pointer}
  #editBtn:active{transform:translateY(1px)}
  #editWrap{position:fixed;inset:0;z-index:200;background:rgba(43,7,9,.97);display:none;overflow:auto;-webkit-overflow-scrolling:touch}
  #editWrap.open{display:block}
  .ew-in{max-width:640px;margin:0 auto;padding:22px 18px 60px}
  .ew-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .ew-head b{font-size:18px;letter-spacing:4px;color:#F7E7C3;font-weight:normal}
  .ew-close{background:none;border:1px solid rgba(232,198,106,.45);color:#d9b36a;border-radius:999px;
    width:34px;height:34px;font-size:16px;cursor:pointer;font-family:inherit}
  .ew-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .ew-tabs button{background:none;border:1px solid rgba(232,198,106,.4);color:#e8c66a;border-radius:999px;
    padding:6px 14px;font-size:13px;letter-spacing:2px;cursor:pointer;font-family:inherit}
  .ew-tabs button.on{background:#e8c66a;color:#6d1212}
  .ew-note{font-size:12px;line-height:1.8;color:rgba(243,226,192,.55);letter-spacing:1px;margin-bottom:16px}
  .ew-f{margin-bottom:12px}
  .ew-f label{display:block;font-size:12.5px;letter-spacing:2px;color:#cfa95e;margin-bottom:5px}
  .ew-f input{width:100%;box-sizing:border-box;background:#fbf6ea;border:1px solid #d9b36a;border-radius:7px;
    padding:9px 12px;font-size:15px;color:#5a2a1e;font-family:inherit}
  .ew-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
  .ew-actions button{flex:1;min-width:110px;padding:10px 0;font-size:14px;letter-spacing:3px;border-radius:8px;
    border:1px solid #d9b36a;cursor:pointer;font-family:inherit;background:none;color:#e8c66a}
  .ew-actions .save{background:linear-gradient(160deg,#fbf6ea,#f3e9d2);color:#6d1212}
  .ew-io textarea{width:100%;box-sizing:border-box;height:90px;background:#fbf6ea;border:1px solid #d9b36a;border-radius:7px;
    padding:8px 10px;font-size:12px;color:#5a2a1e;display:none;margin-top:16px}
  #editToast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;background:#fbf6ea;color:#6d1212;
    padding:9px 22px;border-radius:999px;border:1px solid #d9b36a;font-size:13px;letter-spacing:2px;opacity:0;transition:opacity .4s;pointer-events:none}
</style>
<button id="editBtn">✏ 编辑基本信息</button>
<div id="editWrap">
  <div class="ew-in">
    <div class="ew-head"><b>编辑基本信息</b><button class="ew-close" id="ewClose" aria-label="关闭">×</button></div>
    <div class="ew-tabs" id="ewTabs"></div>
    <div class="ew-note">说明：修改保存在本浏览器（localStorage），仅本机查看各页面时生效；换设备用「导出 / 导入」搬运配置。留空或改回默认值即恢复原文字。新增文字若超出原字体子集，会回退为系统字体。</div>
    <div id="ewForm"></div>
    <div class="ew-actions">
      <button class="save" id="ewSave">保存</button>
      <button id="ewReset">恢复本项默认</button>
      <button id="ewExport">导出</button>
      <button id="ewImportBtn">导入</button>
    </div>
    <textarea id="ewJson" placeholder="「导出」后配置在此，可复制带走；「导入」时粘贴到此，点「确认导入」"></textarea>
    <div class="ew-actions" id="ewIoRow" style="display:none"><button class="save" id="ewDoImport">确认导入</button></div>
  </div>
</div>
<div id="editToast"></div>
<script>
(function(){
  var FIELDS={groom:"新郎姓名",bride:"新娘姓名",date:"婚期",lunar:"农历文案",venue:"地点",venueShort:"地点简称",caller:"来电显示",venueShortEn:"地点简称(英)",groomEn:"新郎英文名",brideEn:"新娘英文名"};
  var ITEMS={
    "inv-b":{label:"请柬 · N",order:["groom","bride","date","lunar","venue","venueShort","caller"]},
    "inv-g":{label:"请柬 · M",order:["groom","bride","date","lunar","venue","venueShort","caller"]},
    "inv-o":{label:"请柬 · X",order:["groom","bride","date","lunar","venue","venueShort","caller"]},
    "inv-w":{label:"请柬 · W",order:["groom","bride","date","lunar","venue","venueShort","venueShortEn","caller"]},
    "pcn":{label:"海报 · 中式",order:["groom","bride","date","lunar","venue","venueShort"]},
    "pwe":{label:"海报 · 西式",order:["groomEn","brideEn","groom","bride","date","lunar","venueShort"],labels:{venueShort:"地点"}}
  };
  var DEF={groom:"周煜全",bride:"张令仪",date:"2027-01-26",lunar:"农历丙午年腊月十九",
    venueShort:"张府",venueShortEn:"Zhang Mansion",venue:{},
    groomEn:"Lingyi",brideEn:"Yuquan",caller:{}};
  DEF.venue["inv-b"]=DEF.venue["inv-o"]=DEF.venue["inv-w"]=DEF.venue["pcn"]="湖南省常德市桃源县沙坪镇";
  DEF.caller["inv-b"]="张思元&刘萍";DEF.caller["inv-g"]="周小健&张燕玲";DEF.caller["inv-o"]="周煜全&张令仪";DEF.caller["inv-w"]="周煜全&张令仪";
  var store={},active="inv-b";
  function load(){try{store=JSON.parse(localStorage.getItem("wedit.v1")||"{}")||{}}catch(e){store={}}}
  function persist(){localStorage.setItem("wedit.v1",JSON.stringify(store))}
  function defv(k,f){if(f==="caller")return DEF.caller[k]||"";if(f==="venue")return DEF.venue[k]!=null?DEF.venue[k]:"";return DEF[f]||""}
  function cur(k,f){var o=store[k]||{};return o[f]!=null?String(o[f]):defv(k,f)}
  function toast(m){var t=document.getElementById("editToast");t.textContent=m;t.style.opacity=1;setTimeout(function(){t.style.opacity=0},2200)}
  function renderTabs(){var w=document.getElementById("ewTabs");w.innerHTML="";Object.keys(ITEMS).forEach(function(k){
    var b=document.createElement("button");b.textContent=ITEMS[k].label;if(k===active)b.className="on";
    b.onclick=function(){active=k;renderTabs();renderForm()};w.appendChild(b)})}
  function renderForm(){var f=document.getElementById("ewForm");f.innerHTML="";ITEMS[active].order.forEach(function(fd){
    var w=document.createElement("div");w.className="ew-f";
    var l=document.createElement("label");l.textContent=(ITEMS[active].labels&&ITEMS[active].labels[fd])||FIELDS[fd]||fd;w.appendChild(l);
    var i=document.createElement("input");i.type=(fd==="date")?"date":"text";i.value=cur(active,fd);i.setAttribute("data-f",fd);
    if(!defv(active,fd))i.placeholder="留空保持页面现状";
    w.appendChild(i);f.appendChild(w)})}
  function openPanel(){load();renderTabs();renderForm();document.getElementById("editWrap").className="open"}
  document.getElementById("editBtn").onclick=openPanel;
  document.getElementById("ewClose").onclick=function(){document.getElementById("editWrap").className=""};
  document.getElementById("ewSave").onclick=function(){
    var o={},n=0;ITEMS[active].order.forEach(function(fd){
      var i=document.querySelector('#ewForm input[data-f="'+fd+'"]');
      var v=i.value.trim();
      if(v&&v!==defv(active,fd)){o[fd]=v;n++}
    });
    if(n)store[active]=o;else delete store[active];
    persist();toast(n?"已保存，本浏览器打开对应页面即生效":"与默认一致，已清除本项修改")};
  document.getElementById("ewReset").onclick=function(){delete store[active];persist();renderForm();toast("已恢复本项默认")};
  document.getElementById("ewExport").onclick=function(){
    var t=document.getElementById("ewJson");t.style.display="block";t.value=JSON.stringify(store);
    document.getElementById("ewIoRow").style.display="none";t.focus();t.select();
    try{document.execCommand("copy");toast("已全选并复制，可粘贴到其他设备导入")}catch(e){toast("请长按全选复制")}};
  document.getElementById("ewImportBtn").onclick=function(){
    var t=document.getElementById("ewJson");t.style.display="block";t.value="";t.placeholder="粘贴导出的配置后点「确认导入」";
    document.getElementById("ewIoRow").style.display="flex";t.focus()};
  document.getElementById("ewDoImport").onclick=function(){
    try{var o=JSON.parse(document.getElementById("ewJson").value||"{}");var bad=Object.keys(o).filter(function(k){return !ITEMS[k]});
    if(bad.length){toast("配置含未知项目："+bad.join(","));return}
    store=o;persist();renderForm();document.getElementById("ewIoRow").style.display="none";toast("导入成功")}catch(e){toast("解析失败，请检查粘贴内容")}};
})();
</script>

</body>
